name: links-weekly

# Sites on a list go down for an hour and come back, so the full check never
# blocks a merge and never pushes to a branch. Once a week it checks every
# link in README.md and keeps one open issue titled "Dead links" with the
# report. A clean run closes that issue.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-weekly
  cancel-in-progress: false

jobs:
  links-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lychee never caches a failure, so a rerun on the same day skips only
      # the links that already passed.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --insecure --timeout 30
            --max-retries 3 --retry-wait-time 5
            --accept '200..=299,403,429'
            --cache --max-cache-age 1d
            README.md
          output: lychee/out.md
          fail: false
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
      - name: Open, update or close the "Dead links" issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dead links"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          case "$EXIT_CODE" in
            0)
              if [ -n "$number" ]; then
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                  --comment "Every link passes again: $RUN_URL"
              fi
              ;;
            2)
              {
                echo "The weekly link check found links that still fail after three retries."
                echo "Fix or remove them; this issue closes itself on the next clean run."
                echo
                echo "Run: $RUN_URL"
                echo
                head -c 60000 lychee/out.md
              } > body.md
              if [ -z "$number" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
              else
                gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
              fi
              ;;
            *)
              echo "::error::lychee exited with '$EXIT_CODE': a setup or runtime error, not a dead link"
              exit 1
              ;;
          esac
