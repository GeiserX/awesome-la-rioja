<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="256" height="256" role="img" aria-label="Awesome La Rioja">
  <!-- The favicon: the same barrel head as logo.svg, on a plate in the banner's
       darkest cellar stop (#0a0a0f), with the banner's lamp colour (#ffb65c, from
       d-lamp) as a glow behind the barrel. Ids carry an aw- prefix. -->
  <defs>
    <radialGradient id="aw-icon-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb65c" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#ffb65c" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffb65c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aw-icon-belly" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#6e1a26"/><stop offset="0.8" stop-color="#4a1018"/><stop offset="1" stop-color="#26080e"/>
    </radialGradient>
    <radialGradient id="aw-icon-oak" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#d9a86a"/><stop offset="0.6" stop-color="#b07a42"/><stop offset="1" stop-color="#7a4f28"/>
    </radialGradient>
    <linearGradient id="aw-icon-hoop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b6a70"/><stop offset="0.5" stop-color="#2c2b31"/><stop offset="1" stop-color="#151418"/>
    </linearGradient>
    <clipPath id="aw-icon-head"><circle r="25"/></clipPath>
  </defs>
  <rect width="360" height="360" rx="72" fill="#0a0a0f"/>
  <circle cx="180" cy="180" r="170" fill="url(#aw-icon-lamp)"/>
  <g transform="translate(180 180) scale(3.6)">
    <circle r="33" fill="url(#aw-icon-belly)"/>
    <circle r="30.5" fill="url(#aw-icon-hoop)"/>
    <circle r="28.6" fill="#6b4322"/>
    <circle r="26.8" fill="#2a1608"/>
    <circle r="25" fill="url(#aw-icon-oak)"/>
    <g clip-path="url(#aw-icon-head)" stroke="#6a4220" stroke-width="2" opacity="0.75">
      <path d="M-15,-27V27M-5,-27V27M5,-27V27M15,-27V27"/>
    </g>
    <g clip-path="url(#aw-icon-head)" fill="#ffffff" opacity="0.06">
      <rect x="-5" y="-27" width="10" height="54"/><rect x="15" y="-27" width="12" height="54"/>
    </g>
    <circle r="25" fill="none" stroke="#3a2210" stroke-width="2"/>
    <circle cx="0" cy="16" r="2.2" fill="#2c190b"/>
  </g>
</svg>
