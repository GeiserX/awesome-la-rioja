<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- A vellum leaf of the Glosas Emilianenses, San Millán de la Cogolla: the romance gloss written in the margins -->
  <defs>
    <clipPath id="c-clip"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="c-vellum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e9d0"/>
      <stop offset="1" stop-color="#e6d4ae"/>
    </linearGradient>
    <radialGradient id="c-edge" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#b08a55" stop-opacity="0"/>
      <stop offset="1" stop-color="#8a6436" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="c-stain" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1200" height="600"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <g clip-path="url(#c-clip)">
    <rect width="800" height="200" fill="url(#c-vellum)"/>
    <ellipse cx="690" cy="40" rx="120" ry="50" fill="#c9a36b" opacity="0.18" filter="url(#c-stain)"/>
    <ellipse cx="90" cy="170" rx="140" ry="50" fill="#c9a36b" opacity="0.16" filter="url(#c-stain)"/>
    <rect width="800" height="200" fill="url(#c-edge)"/>

    <!-- dry-point ruling and prickings -->
    <g stroke="#a88758" stroke-width="0.7" opacity="0.45">
      <path d="M40 38.5 L760 38.5"/>
      <path d="M40 162.5 L760 162.5"/>
      <path d="M40 182.5 L760 182.5"/>
      <path d="M72 18 L72 192"/>
      <path d="M728 18 L728 192"/>
    </g>
    <g fill="#8f6c40" opacity="0.5">
      <circle cx="24" cy="38.5" r="1"/><circle cx="24" cy="162.5" r="1"/><circle cx="24" cy="182.5" r="1"/>
      <circle cx="776" cy="38.5" r="1"/><circle cx="776" cy="162.5" r="1"/><circle cx="776" cy="182.5" r="1"/>
    </g>

    <!-- the gloss, in the scribe's romance -->
    <g font-family="Georgia, 'Times New Roman', Times, serif" font-style="italic" font-size="12" fill="#5a3a22" fill-opacity="0.78">
      <text x="100" y="36" textLength="616" lengthAdjust="spacing">ono aiutorio de nuestro dueno, dueno Christo, dueno Salbatore, qual dueno get ena honore,</text>
      <text x="84" y="160" textLength="632" lengthAdjust="spacing">e qual duenno tienet ela mandatione cono Patre, cono Spiritu Sancto, enos sieculos de losieculos.</text>
      <text x="84" y="180" letter-spacing="0.6">Faca nos Deus omnipotes tal serbitio fere ke denante ela sua face gaudioso segamus.</text>
    </g>

    <text x="80" y="40" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" font-weight="700" fill="#9c3b22">C</text>
    <!-- horseshoe arches of San Millán de Suso, drawn in ink -->
    <path d="M105.5 148 L105.5 94 A20 20 0 1 1 138.5 94 L138.5 148 Z M153.5 148 L153.5 94 A20 20 0 1 1 186.5 94 L186.5 148 Z M613.5 148 L613.5 94 A20 20 0 1 1 646.5 94 L646.5 148 Z M661.5 148 L661.5 94 A20 20 0 1 1 694.5 94 L694.5 148 Z" fill="#b8925c" fill-opacity="0.18"/>
