dth="1.1" stroke-linecap="round"/>
    <text x="400" y="100" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1e140c" letter-spacing="1">awesome-la-rioja</text>
    <rect x="340" y="112" width="120" height="2" rx="1" fill="#9c3b22" opacity="0.8"/>
    <text x="400" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6e2a18" letter-spacing="3">SOFTWARE OPEN SOURCE PARA LA RIOJA</text>
  </g>
</svg>
