      <use xlink:href="#e-berry" href="#e-berry" x="554.9" y="167.6"/>
      <use xlink:href="#e-berry" href="#e-berry" x="570.8" y="168.9"/>
      <use xlink:href="#e-berry" href="#e-berry" x="518.0" y="169.5"/>
      <use xlink:href="#e-berry" href="#e-berry" x="528.3" y="172.1"/>
      <use xlink:href="#e-berry" href="#e-berry" x="547.5" y="172.8"/>
      <use xlink:href="#e-berry" href="#e-berry" x="564.6" y="173.5"/>
      <use xlink:href="#e-berry" href="#e-berry" x="539.0" y="175.2"/>
      <use xlink:href="#e-berry" href="#e-berry" x="556.3" y="178.0"/>
      <use xlink:href="#e-berry" href="#e-berry" x="519.8" y="179.2"/>
