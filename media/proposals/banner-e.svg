    <text x="50" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" fill-opacity="0.68" letter-spacing="2.6">SOFTWARE OPEN SOURCE PARA LA RIOJA</text>
