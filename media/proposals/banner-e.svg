<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 200" width="800" height="200">
  <!-- Still life: a glass of Rioja red, a bottle in its gold wire mesh, a bunch of tempranillo -->
  <defs>
    <clipPath id="e-clip"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="e-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/><stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <radialGradient id="e-glow" cx="650" cy="110" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e1a24" stop-opacity="0.55"/><stop offset="0.5" stop-color="#3a0f18" stop-opacity="0.3"/><stop offset="1" stop-color="#14141f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="e-bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050807"/><stop offset="0.28" stop-color="#1c2a22"/><stop offset="0.42" stop-color="#2c3f33"/><stop offset="0.7" stop-color="#101913"/><stop offset="1" stop-color="#040605"/>
    </linearGradient>
    <linearGradient id="e-capsule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c0710"/><stop offset="0.4" stop-color="#9c1c2e"/><stop offset="1" stop-color="#34060e"/>
    </linearGradient>
    <linearGradient id="e-label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7c64"/><stop offset="0.4" stop-color="#efe4cc"/><stop offset="1" stop-color="#7c705a"/>
    </linearGradient>
    <pattern id="e-mesh" width="7" height="9" patternUnits="userSpaceOnUse" x="588" y="92">
      <path d="M0,4.5L3.5,0L7,4.5L3.5,9Z" fill="none" stroke="#d9ad4c" stroke-width="0.75"/>
      <circle cx="3.5" cy="0" r="0.9" fill="#f0cd72"/><circle cx="0" cy="4.5" r="0.9" fill="#f0cd72"/><circle cx="7" cy="4.5" r="0.9" fill="#f0cd72"/><circle cx="3.5" cy="9" r="0.9" fill="#f0cd72"/>
    </pattern>
    <clipPath id="e-body"><path d="M588,94H642V188Q642,192 638,192H592Q588,192 588,188Z"/></clipPath>
    <clipPath id="e-bowl"><path d="M687,36C683,60 676,92 680,112C684,134 700,146 713,149L717,149C730,146 746,134 750,112C754,92 747,60 743,36Z"/></clipPath>
