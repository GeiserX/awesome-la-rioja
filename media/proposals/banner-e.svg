    <ellipse cx="715" cy="36" rx="28" ry="3.4" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M690,50C686,72 684,94 687,112" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M744,60C747,76 748,88 747,98" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.4" stroke-linecap="round"/>
